
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css.css">
    <title>login</title>
</head>

<body>
    <header>
        <div class="logo">
            <h1>TechStore</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html"> Productos </a></li>
                <li><a href="#">Ofertas</a></li>
                <li><a href="contacto.html">Contacto </a></li>
            </ul>
        </nav>
        <div class="acciones">
            <input type="search" placeholder="Buscar productos...">
            <button>
                Carrito
            </button>
            <a href="registro.html"><button> Registrate </button></a>
        </div>
    </header>


    <main>
        <div class="login-container">
            <div class="login-box">
                <h2>Iniciar Sesión</h2>
                <form>
                    <label>
                        Usuario o Correo
                    </label>
                    <input type="text" id="usuario" placeholder="Ingresa tu usuario">
                    <label>
                        Contraseña
                    </label>
                    <input type="password" id="password" placeholder="Ingresa tu contraseña">
                    <button type="button" onclick="validarLogin()">
                        Ingresar
                    </button>
                </form>
            </div>
        </div>

    </main>

    <!-- Custom Modal -->
    <div class="modal-overlay" id="customModal">
        <div class="modal-content">
            <div class="modal-icon" id="modalIcon">✓</div>
            <h3 id="modalTitle">¡Éxito!</h3>
            <p id="modalMessage">Inicio de sesión exitoso.</p>
        </div>
    </div>

    <script>
        function mostrarModal(tipo, titulo, mensaje) {
            const modal = document.getElementById('customModal');
            const modalIcon = document.getElementById('modalIcon');
            const modalTitle = document.getElementById('modalTitle');
            const modalMessage = document.getElementById('modalMessage');

            modalIcon.className = 'modal-icon ' + tipo;
            modalIcon.innerHTML = tipo === 'success' ? '✓' : '✗';
            modalTitle.innerText = titulo;
            modalMessage.innerText = mensaje;

            modal.classList.add('active');
        }

        function cerrarModal() {
            document.getElementById('customModal').classList.remove('active');
        }

        function validarLogin() {
            const usuario = document.getElementById('usuario').value;
            const password = document.getElementById('password').value;

            // Lista de administradores permitidos
            const administradores = [
                { user: 'ronald', pass: 'tienda123' },
                { user: 'guillermo', pass: 'guillermo123' },
                { user: 'carlos', pass: 'carlos123' },
                { user: 'victor', pass: 'victor123' }
            ];

            // Verificamos si las credenciales coinciden con algún administrador
            const esValido = administradores.some(admin => admin.user === usuario && admin.pass === password);

            if (esValido) {
                mostrarModal('success', '¡Bienvenido!', 'Inicio de sesión exitoso. Redirigiendo...');
                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 2000);
            } else {
                mostrarModal('error', 'Error de Autenticación', 'Las credenciales son incorrectas.');
                setTimeout(cerrarModal, 3000);
            }
        }
    </script>

    <footer>
        <h3>
            TechStore
        </h3>
        <p>
            Tecnología confiable para todos.
        </p>
        <p>
            © 2026 Todos los derechos reservados
        </p>
    </footer>
</body>
</html>
